[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tusdt-cli"
version = "0.1.0"
description = "CLI for interacting with the TUSDT ink! smart contract system on subtensor(bittensor)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "tensorusd/benup" },
]

dependencies = [
    "click>=8.1.0",
    "substrate-interface>=1.7.0",
    "rich>=13.0.0",
    "pynacl>=1.5.0",
]

[project.scripts]
tusdt = "tusdt_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tusdt_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/tusdt_cli/abi" = "tusdt_cli/abi"
